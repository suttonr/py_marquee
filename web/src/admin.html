<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Marquee Control</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="common.css">
</head>
<body>
    <!-- Menu Backdrop -->
    <div class="menu-backdrop" id="menuBackdrop" onclick="toggleMenu()"></div>

    <!-- Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay">
        <div class="menu-header">
            <h2>Navigation</h2>
        </div>
        <nav class="menu-items">
            <a href="index.html" class="menu-item">
                <i class="fas fa-tv"></i>
                <span>Marquee Control</span>
            </a>
            <a href="launcher.html" class="menu-item">
                <i class="fas fa-rocket"></i>
                <span>Launcher</span>
            </a>
            <a href="admin.html" class="menu-item active">
                <i class="fas fa-cog"></i>
                <span>Administration</span>
            </a>
            <a href="/logout" class="menu-item">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </a>
        </nav>
    </div>

    <div class="header">
        <div class="hamburger-menu">
            <button class="hamburger-btn" id="hamburgerBtn" onclick="toggleMenu()" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <h1><i class="fas fa-cog"></i> Administration</h1>
        </div>
    </div>

    <div class="container">
        <div class="card-grid">
            <div class="card">
                <h3><i class="fas fa-user-plus"></i> User Registrations</h3>
                <p>Control whether new users can register passkeys</p>
                <div class="form-group" style="display: flex; align-items: center; justify-content: space-between; margin-top: 20px;">
                    <label for="registration-toggle" style="margin-bottom: 0; font-size: 1rem;">Allow New Registrations</label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="registration-toggle">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div id="status-message" style="margin-top: 15px; font-size: 0.9rem; color: var(--text-secondary);"></div>
            </div>

            <div class="card">
                <h3><i class="fas fa-users"></i> Registered Users</h3>
                <p>Users with registered passkeys</p>
                <div id="users-list" style="margin-top: 20px;">
                    <p>Loading users...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load current registration status
        async function loadRegistrationStatus() {
            try {
                const response = await fetch('/api/admin/registration-status');
                const data = await response.json();
                document.getElementById('registration-toggle').checked = data.enabled;
                updateStatusMessage(data.enabled);
            } catch (e) {
                console.error('Error loading registration status:', e);
                showAlert('Error loading registration status', 'error');
            }
        }

        // Update status message
        function updateStatusMessage(enabled) {
            const messageEl = document.getElementById('status-message');
            if (enabled) {
                messageEl.textContent = 'New user registrations are currently enabled';
                messageEl.style.color = 'var(--success-color)';
            } else {
                messageEl.textContent = 'New user registrations are currently disabled';
                messageEl.style.color = 'var(--error-color)';
            }
        }

        // Handle toggle change
        document.getElementById('registration-toggle').addEventListener('change', async function() {
            const enabled = this.checked;
            try {
                const response = await fetch('/api/admin/registration-status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enabled })
                });

                if (response.ok) {
                    updateStatusMessage(enabled);
                    showAlert(`Registrations ${enabled ? 'enabled' : 'disabled'} successfully`, 'success');
                } else {
                    // Revert toggle on error
                    this.checked = !enabled;
                    const error = await response.json();
                    showAlert(error.error || 'Failed to update registration status', 'error');
                }
            } catch (e) {
                // Revert toggle on error
                this.checked = !enabled;
                console.error('Error updating registration status:', e);
                showAlert('Error updating registration status', 'error');
            }
        });

        // Alert system
        function showAlert(message, type) {
            // Create alert element
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 12px 16px;
                border-radius: 8px;
                font-size: 14px;
                z-index: 1000;
                max-width: 300px;
            `;

            if (type === 'success') {
                alert.style.backgroundColor = 'rgba(16, 185, 129, 0.1)';
                alert.style.color = '#10b981';
                alert.style.border = '1px solid rgba(16, 185, 129, 0.2)';
            } else if (type === 'error') {
                alert.style.backgroundColor = 'rgba(239, 68, 68, 0.1)';
                alert.style.color = '#ef4444';
                alert.style.border = '1px solid rgba(239, 68, 68, 0.2)';
            }

            alert.textContent = message;
            document.body.appendChild(alert);

            // Auto-hide after 3 seconds
            setTimeout(() => {
                alert.remove();
            }, 3000);
        }

        // Hamburger menu functionality
        function toggleMenu() {
            const menuOverlay = document.getElementById('menuOverlay');
            const menuBackdrop = document.getElementById('menuBackdrop');
            menuOverlay.classList.toggle('open');
            menuBackdrop.classList.toggle('open');
        }

        // Load users list
        async function loadUsers() {
            try {
                const response = await fetch('/api/admin/users');
                const data = await response.json();
                displayUsers(data.users);
            } catch (e) {
                console.error('Error loading users:', e);
                document.getElementById('users-list').innerHTML = '<p style="color: var(--error-color);">Error loading users</p>';
            }
        }

        // Display users in the UI
        function displayUsers(users) {
            const usersListEl = document.getElementById('users-list');

            if (users.length === 0) {
                usersListEl.innerHTML = '<p>No registered users found.</p>';
                return;
            }

            const usersHtml = users.map(user => `
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 0.375rem; margin-bottom: 0.5rem; background: var(--card-bg);">
                    <div>
                        <strong>${user.username}</strong>
                        <br>
                        <small style="color: var(--text-secondary);">
                            ${user.credential_count} credential${user.credential_count !== 1 ? 's' : ''}
                        </small>
                    </div>
                    <div style="display: flex; align-items: center;">
                        ${user.has_credentials ?
                            '<span style="color: var(--success-color); margin-right: 0.5rem;"><i class="fas fa-check-circle"></i></span>' :
                            '<span style="color: var(--error-color); margin-right: 0.5rem;"><i class="fas fa-times-circle"></i></span>'
                        }
                    </div>
                </div>
            `).join('');

            usersListEl.innerHTML = usersHtml;
        }

        // Load status on page load
        loadRegistrationStatus();
        loadUsers();
    </script>
</body>
</html>
