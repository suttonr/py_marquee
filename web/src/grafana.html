<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grafana - Marquee Control</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="common.css">
    <style>
        /* Override container styles for full-height iframe */
        * {
            box-sizing: border-box;
        }
        
        .container {
            padding: 0 !important;
            max-width: none !important;
            width: 100% !important;
            flex: 1;
            display: flex;
            flex-direction: column;
            margin: 0 !important;
            left: 0 !important;
            right: 0 !important;
        }

        .grafana-container {
            flex: 1;
            width: 100vw;
            overflow: hidden;
            position: relative;
            margin: 0;
            padding: 0;
            left: 0;
            right: 0;
        }

        .grafana-iframe {
            width: 100vw;
            height: 100%;
            border: none;
            display: block;
            margin: 0;
            padding: 0;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        /* Ensure body takes full height and width */
        html, body {
            height: 100vh;
            width: 100vw;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* Override any header styles that might have padding */
        .header {
            margin: 0 !important;
            padding-left: 0 !important;
            padding-right: 0 !important;
            width: 100vw !important;
        }
    </style>
</head>
<body>
    <!-- Menu Backdrop -->
    <div class="menu-backdrop" id="menuBackdrop" onclick="toggleMenu()"></div>
    
    <!-- Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay">
        <div class="menu-header">
            <h2>Navigation</h2>
        </div>
        <nav class="menu-items">
            <a href="index.html" class="menu-item">
                <i class="fas fa-tv"></i>
                <span>Marquee Control</span>
            </a>
            <a href="launcher.html" class="menu-item">
                <i class="fas fa-rocket"></i>
                <span>Launcher</span>
            </a>
            <a href="grafana.html" class="menu-item active">
                <i class="fas fa-arrow-trend-up"></i>
                <span>Grafana</span>
            </a>
            <a href="admin.html" class="menu-item">
                <i class="fas fa-cog"></i>
                <span>Administration</span>
            </a>
            <a href="/logout" class="menu-item">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </a>
        </nav>
    </div>

    <div class="header">
        <div class="hamburger-menu">
            <button class="hamburger-btn" id="hamburgerBtn" onclick="toggleMenu()" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <h1><i class="fas fa-arrow-trend-up"></i> Grafana</h1>
        </div>
    </div>

    <div class="container">
        <div class="grafana-container">
            <iframe class="grafana-iframe" src="/grafana/" title="Grafana Dashboard"></iframe>
        </div>
    </div>

    <!-- Import Common JavaScript -->
    <script type="module">
        import { applySavedTheme } from './common.mjs';

        // Apply saved theme (dark mode)
        applySavedTheme();
    </script>
</body>
</html>
