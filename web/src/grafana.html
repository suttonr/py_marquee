<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grafana - Marquee Control</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="common.css">
    <style>
        /* Override container styles for full-height iframe */
        .container {
            padding: 0;
            max-width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .grafana-container {
            flex: 1;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        .grafana-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Ensure body takes full height */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <!-- Menu Backdrop -->
    <div class="menu-backdrop" id="menuBackdrop" onclick="toggleMenu()"></div>
    
    <!-- Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay">
        <div class="menu-header">
            <h2>Navigation</h2>
        </div>
        <nav class="menu-items">
            <a href="index.html" class="menu-item">
                <i class="fas fa-tv"></i>
                <span>Marquee Control</span>
            </a>
            <a href="launcher.html" class="menu-item">
                <i class="fas fa-rocket"></i>
                <span>Launcher</span>
            </a>
            <a href="grafana.html" class="menu-item active">
                <i class="fas fa-arrow-trend-up"></i>
                <span>Grafana</span>
            </a>
            <a href="admin.html" class="menu-item">
                <i class="fas fa-cog"></i>
                <span>Administration</span>
            </a>
            <a href="/logout" class="menu-item">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </a>
        </nav>
    </div>

    <div class="header">
        <div class="hamburger-menu">
            <button class="hamburger-btn" id="hamburgerBtn" onclick="toggleMenu()" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <h1><i class="fas fa-arrow-trend-up"></i> Grafana</h1>
        </div>
    </div>

    <div class="container">
        <div class="grafana-container">
            <iframe class="grafana-iframe" src="/grafana/" title="Grafana Dashboard"></iframe>
        </div>
    </div>

    <script>
        // Hamburger menu functionality
        function toggleMenu() {
            const menuOverlay = document.getElementById('menuOverlay');
            const menuBackdrop = document.getElementById('menuBackdrop');
            menuOverlay.classList.toggle('open');
            menuBackdrop.classList.toggle('open');
        }

        // Dark mode functionality
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
</body>
</html>
